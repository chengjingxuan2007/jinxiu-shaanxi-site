<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="锦绣陕西——登录后继续阅读陕西的风景、民俗与味道。">
  <title>登录 · 锦绣陕西</title>
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-shell">
    <aside class="auth-visual">
      <img src="./image/hero-poster.jpg" alt="陕西山河">
      <div class="auth-visual-inner">
        <span class="eyebrow">SHAANXI · CHINA</span>
        <h1>锦绣陕西</h1>
        <div class="auth-visual-en">Splendid Shaanxi</div>
        <p class="auth-visual-note">从黄土高原的辽阔，到秦岭山水的深邃；从周秦汉唐的文明回响，到市井街巷的温热日常。</p>
      </div>
    </aside>

    <main class="auth-panel">
      <div class="auth-card">
        <a class="auth-brand" href="./index.html">
          <span class="seal">秦</span>
          <span><span class="name">锦绣陕西</span><span class="en">Splendid Shaanxi</span></span>
        </a>

        <h2 class="auth-title">欢迎回来</h2>
        <p class="auth-sub">登录后，继续阅读这片土地的风景、民俗与味道。</p>

        <form id="authForm" data-mode="login" novalidate>
          <label class="auth-field" data-field="username">
            <span>用户名</span>
            <input type="text" name="username" autocomplete="username" placeholder="请输入用户名" maxlength="50">
          </label>

          <label class="auth-field" data-field="password">
            <span>密码</span>
            <input type="password" name="password" autocomplete="current-password" placeholder="请输入不少于 8 位密码">
            <em class="hint">密码不少于 8 位</em>
          </label>

          <p class="auth-error" id="authError" role="alert"></p>

          <button class="auth-submit" type="submit">登 录</button>
        </form>

        <div class="auth-divider"><span>或</span></div>

        <button class="auth-guest" id="guestBtn" type="button">游客模式进入</button>

        <p class="auth-switch">还没有账号？<a href="./register.html">立即注册</a></p>
        <p class="auth-foot">© 2026 锦绣陕西 · 陕西文化数字图志</p>
      </div>
    </main>
  </div>

  <div class="auth-toast" id="authToast" role="status"></div>
  <script src="./js/auth.js"></script>
</body>
</html>
